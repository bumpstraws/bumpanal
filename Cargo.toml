[package]
name = "snogo-rust-landing"
version = "0.1.0"
edition = "2021"
description = "Rust + WebAssembly Shopify Buy Button Landing Page with UpPromote, UTM & Plausible Tracking"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-storage = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "Location",
  "Storage",
  "Url",
  "UrlSearchParams",
  "console",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
